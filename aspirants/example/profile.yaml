# Example aspirant profile — copy this folder and edit, or build via:
#   ./run.sh easy --resume path/to/cv.pdf --name "Your Name"
candidate:
  name: Example Candidate
  email: you@example.com
  phone: "+971-00-000-0000"
  linkedin: https://www.linkedin.com/in/example/
  location: Dubai / UAE (target)
  work_auth: Open to UAE/GCC roles (visa sponsorship considered)
experience:
  estimated_years: 2.0
  max_years_required: 3
  level: mid_or_unknown
  target_band: 0-3
target_titles:
  - Network Engineer
  - NOC Engineer
  - IT Support Engineer
exclude_title_signals:
  - senior
  - sr.
  - staff
  - principal
  - director
  - head of
title_must_match_any:
  - network
  - noc
  - it support
  - analyst
skills_positive:
  - network
  - cisco
  - ccna
  - python
  - troubleshooting
certifications:
  - CCNA
geo:
  default_locations:
    - Dubai
    - UAE
  allow_signals:
    - uae
    - dubai
    - abu dhabi
    - sharjah
    - gcc
    - gulf
    - remote
    - visa
    - sponsor
  reject_signals:
    - united states only
    - us citizen
    - must be us based
    - uk only
    - eu only
scoring:
  min_score_to_keep: 35
  title_weight: 30
  skills_weight: 25
  junior_boost: 15
  geo_boost: 20
recency:
  max_age_days: 14
  reject_unknown_date: true
  bucket_week_1_days: 7
  bucket_week_2_days: 14
sources:
  - example
search_queries:
  - Network Engineer
  - NOC Engineer
  - IT Support Engineer
