# Portals: UAE/GCC HTML boards + remote APIs. Worldwide majors use optional JobSpy.
# Untagged portals = UAE-centric (auto-skipped when region is not dubai/uae).
# Placeholders: {query} {query_plus} {query_dash} {location} {location_plus} {location_slug}
# Optional portal key: regions: [dubai, worldwide, ...]

defaults:
  delay_seconds: 1.8
  timeout_seconds: 25
  max_jobs_per_portal: 40
  user_agent: "JobHunter/1.0 (personal job search; respectful crawl)"

queries:
  - network engineer
  - NOC engineer
  - junior network engineer
  - network support

locations:
  - Dubai
  - UAE

portals:
  - id: zerotaxjobs
    name: Zero Tax Jobs
    host: zerotaxjobs.com
    method: html
    search_urls:
      - "https://zerotaxjobs.com/?s={query_plus}"
    job_path_hints: ["/job", "/jobs/", "/careers/"]
    fallback: site_search

  - id: edarabia
    name: Edarabia Jobs
    host: edarabia.com
    method: html
